AllCops:
  Exclude:
    - 'bin/*'
    - 'db/schema.rb'
    - 'vendor/**/*'
  NewCops: enable
  SuggestExtensions: false

Style/ClassAndModuleChildren:
  Exclude:
    - 'test/**/*'

Style/Documentation:
  Exclude:
    - 'app/controllers/**/*'
    - 'app/helpers/**/*'
    - 'app/mailers/**/*'
    - 'app/**/application_*'
    - 'config/*'
    - 'db/**/*'
    - 'test/**/*'

# Config DSL blocks (environments, ActiveAdmin resources) and tests read
# better as one long block; do not enforce artificial limits there.
Metrics/BlockLength:
  Exclude:
    - 'app/admin/**/*'
    - 'config/environments/**/*'
    - 'test/**/*'

Metrics/AbcSize:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Layout/LineLength:
  Max: 80
  AllowedPatterns: ['\A\s*#']
